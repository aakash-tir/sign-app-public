[project]
name = "sign-ml"
version = "0.0.0"
description = "ASL recognition training & tooling pipeline for Sign App (build-time only)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
# Heavy ML deps (mediapipe, tensorflow, tensorflowjs) are added in M2 when the
# recognition pipeline lands. M0 keeps this minimal so the gates run fast.

[dependency-groups]
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sign_ml"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
