[project]
name = "sign-ml"
version = "0.0.0"
description = "ASL recognition training & tooling pipeline for Sign App (build-time only)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.6",
    "scikit-learn>=1.8.0",
]

[project.optional-dependencies]
# Only needed to extract landmarks from real ASL-alphabet images. Kept optional
# (and import-guarded) so the core pipeline + gates don't depend on mediapipe,
# which is heavy and version-sensitive. Install with: uv sync --extra images
images = ["mediapipe>=0.10"]

[dependency-groups]
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sign_ml"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

# Third-party packages without bundled type stubs.
[[tool.mypy.overrides]]
module = ["sklearn.*", "mediapipe.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
