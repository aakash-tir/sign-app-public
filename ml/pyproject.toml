[project]
name = "sign-ml"
version = "0.0.0"
description = "ASL recognition training & tooling pipeline for Sign App (build-time only)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.6",
    "scikit-learn>=1.8.0",
]

[project.optional-dependencies]
# Only needed to extract landmarks from real ASL-alphabet images. Kept optional
# (and import-guarded) so the core pipeline + gates don't depend on mediapipe,
# which is heavy and version-sensitive. Install with: uv sync --extra images
images = ["mediapipe>=0.10"]
# Dynamic-sign (M6) video extraction: MediaPipe HolisticLandmarker + OpenCV for
# frame reading. Optional + import-guarded. Install with: uv sync --extra video
video = ["mediapipe>=0.10", "opencv-python>=4.10"]
# Dynamic-sign (M6) training + ONNX export. PyTorch (not TensorFlow): tensorflowjs
# has no Windows wheels and TF pins numpy<2.2 (conflicts with our numpy). Torch
# coexists with numpy 2.x and exports ONNX natively (ADR-015). Optional +
# import-guarded. Install with: uv sync --extra train
train = ["torch>=2.4", "onnx>=1.16"]
# MS-ASL clip download (Phase 3 / P3M2): MS-ASL ships as YouTube URLs, fetched with
# yt-dlp (also needs ffmpeg on PATH for segment cuts). Optional + lazy-imported.
# Install with: uv sync --extra msasl
msasl = ["yt-dlp>=2024.8"]

[dependency-groups]
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sign_ml"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

# Third-party packages without bundled type stubs.
[[tool.mypy.overrides]]
module = ["sklearn.*", "mediapipe.*", "cv2", "cv2.*", "onnx", "onnx.*", "yt_dlp", "yt_dlp.*"]
ignore_missing_imports = true

# Torch: treat as untyped whether or not it is installed, so the gate behaves
# identically in CI (torch absent) and locally (torch present, heavy stubs).
[[tool.mypy.overrides]]
module = ["torch", "torch.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
