# Frontend: Prettier, ESLint, typecheck, Vitest unit tests and Playwright e2e.
#
# Kept lean on Actions minutes: pull requests only (the merge to main re-runs nothing,
# the PR already tested it), and only when a file this check depends on changed.
# Docs-only changes (docs/, logs/, graphify-out/, *.md) run no CI at all. Run it by
# hand from the Actions tab (workflow_dispatch) when needed.
name: frontend

on:
  pull_request:
    # milestone/** covers PRs into phase integration branches (e.g. Phase 5's
    # milestone/P5-sentences), so sub-milestone PRs get the same gates as main.
    branches: [main, 'milestone/**']
    paths:
      - 'frontend/**'
      # Generated Capacitor project: Prettier, ESLint and tsc all ignore it.
      - '!frontend/android/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (React + TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prettier
        run: npm run format

      - name: ESLint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm run test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests (Playwright)
        run: npm run test:e2e
