# Frontend (PWA): format, lint, types, unit tests, e2e.
#
# Kept lean on Actions minutes: pull requests only (the merge to main re-runs nothing,
# the PR already tested it), and only when a file this check depends on changed.
# Docs-only changes (docs/, logs/, graphify-out/, *.md) run no CI at all. Run it by
# hand from the Actions tab (workflow_dispatch) when needed.
#
# frontend/android/ (the Capacitor wrap) and Markdown files don't affect the web
# gates, so they start nothing.
name: frontend

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '!frontend/android/**'
      - '!frontend/**/*.md'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # "frontend" and "ml" are the gate: a PR merges only when every check that started
  # is green (rule in .claude/rules/workflow.md; GitHub Free has no branch protection
  # on private repos).
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm run test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests (Playwright)
        run: npm run test:e2e

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
