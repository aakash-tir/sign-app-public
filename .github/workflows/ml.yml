# ML pipeline (build-time Python): format, lint, types, tests.
#
# Kept lean on Actions minutes: pull requests only (the merge to main re-runs nothing,
# the PR already tested it), and only when a file this check depends on changed.
# Docs-only changes (docs/, logs/, graphify-out/, *.md) run no CI at all. Run it by
# hand from the Actions tab (workflow_dispatch) when needed.
#
# frontend/src/recognition/fixtures/ is included because the pytest parity tests read
# the shared golden-vector fixtures (normalization must match the TS runtime exactly).
name: ml

on:
  pull_request:
    paths:
      - 'ml/**'
      - '!ml/**/*.md'
      - 'frontend/src/recognition/fixtures/**'
      - '.github/workflows/ml.yml'
  workflow_dispatch:

concurrency:
  group: ml-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ml:
    name: ml
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0  # no floating major tag is published
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy .

      - name: Tests
        run: uv run pytest
